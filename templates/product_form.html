{% extends "base.html" %}{% block body %}<section><h1>{{ 'Edit' if p and p.product_id is defined else 'Add' }} product</h1>
<form method="post" class="row">
<label>Name<input name="name" value="{{ p.name if p }}" required></label>
<label>Category<input name="category" value="{{ p.category if p }}" required></label>
<label>Price (₹)<input name="unit_price" type="number" step="0.01" min="0.01" value="{{ p.unit_price if p }}" required></label>
<label>Stock<input name="stock_qty" type="number" min="0" value="{{ p.stock_qty if p }}" required></label>
<label>Reorder level<input name="reorder_level" type="number" min="0" value="{{ p.reorder_level if p else 10 }}"></label>
<label>Expiry date<input name="expiry_date" type="date" value="{{ (p.expiry_date or '') if p }}"></label>
<button>Save product</button><a class="btn plain" href="{{ url_for('products') }}">Cancel</a></form></section>{% endblock %}
