{% extends "base.html" %}{% block body %}<h1>New bill</h1>
<section><form method="post"><div id="lines"></div>
<div class="row"><button type="button" class="plain" id="add">Add item</button>
<label>Discount %<input name="discount" type="number" min="0" max="100" step="0.5" value="0"></label>
<strong id="total">Total: ₹0.00</strong><button>Create bill</button></div></form></section>
<template id="line"><div class="row"><label>Product<select name="product_id" required><option value="">Choose a product</option>
{% for p in prods %}<option value="{{ p.product_id }}" data-price="{{ p.unit_price }}">{{ p.name }} (₹{{ '%.2f' % p.unit_price }}, {{ p.stock_qty }} left)</option>{% endfor %}</select></label>
<label>Quantity<input name="qty" type="number" min="1" value="1" required></label><button type="button" class="danger rm">Remove</button></div></template>
<script>
const lines=document.getElementById('lines'),tpl=document.getElementById('line');
function add(){lines.appendChild(tpl.content.cloneNode(true));}
function calc(){let t=0;lines.querySelectorAll('.row').forEach(r=>{const o=r.querySelector('select').selectedOptions[0];
 if(o&&o.dataset.price)t+=o.dataset.price*r.querySelector('input').value;});
 const d=document.querySelector('[name=discount]').value||0;document.getElementById('total').textContent='Total: ₹'+(t*(1-d/100)).toFixed(2);}
document.getElementById('add').onclick=add;
document.addEventListener('input',calc);
lines.addEventListener('click',e=>{if(e.target.classList.contains('rm')){e.target.closest('.row').remove();calc();}});
add();
</script>{% endblock %}
